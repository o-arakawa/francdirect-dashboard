name: Fetch Meta Ads Data — FrancDirect

on:
  schedule:
    # 10:10 JST に1日1回実行。Meta側の一時エラー時に通知が連発しないようにする。
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-meta-ads
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Meta Ads API + Sheet CV
        env:
          META_ACCESS_TOKEN:  ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_CAMPAIGN_ID:   ${{ secrets.META_CAMPAIGN_ID }}
          META_CV_ACTION:     ${{ secrets.META_CV_ACTION }}
          SHEET_CSV_URL:      ${{ secrets.SHEET_CSV_URL }}
          GAS_YOUTUBE_URL:    ${{ secrets.GAS_YOUTUBE_URL }}
        run: python fetch_meta.py

      - name: Commit & Push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update Meta Ads data [skip ci]"
          git push
