<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrancDirect — 広告ダッシュボード</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#C4A35A;--gold-dim:rgba(196,163,90,0.15);--dark:#09080A;--surface:#110F13;--text:#F4ECDB;--muted:rgba(244,236,219,0.50);--border:rgba(196,163,90,0.18);--blue:#7B9EB8}
body{background:var(--dark);color:var(--text);font-family:'Shippori Mincho',serif;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:0 2rem}
hr.rule{border:none;border-top:.5px solid var(--border)}
header{padding:1.6rem 0}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem}
.brand-logo{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.brand-sub{font-size:.6rem;letter-spacing:.22em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.hdr-right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.last-upd{font-size:.65rem;letter-spacing:.06em;color:var(--muted)}
.refresh-btn{font-size:.65rem;letter-spacing:.12em;color:var(--gold);border:.5px solid rgba(196,163,90,.4);background:none;padding:5px 14px;cursor:pointer;font-family:inherit}
.refresh-btn:hover{background:var(--gold-dim)}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4CAF7D;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.period-bar{display:flex;gap:2px;background:var(--border);width:fit-content;margin:1.4rem 0}
.period-btn{font-size:.65rem;letter-spacing:.1em;padding:6px 18px;background:var(--surface);color:var(--muted);border:none;cursor:pointer;font-family:inherit;text-transform:uppercase}
.period-btn.active{background:var(--gold-dim);color:var(--gold)}
.period-btn:hover:not(.active){color:var(--text)}
.sec{font-size:.58rem;letter-spacing:.38em;color:var(--gold);text-transform:uppercase;margin:1.6rem 0 .8rem;display:flex;align-items:center;gap:.8rem}
.sec::after{content:'';flex:1;border-top:.5px solid var(--border)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:2px;background:var(--border);margin-bottom:2px}
.kpi{background:var(--surface);padding:1.4rem 1.2rem}
.kpi-label{font-size:.58rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:.55rem}
.kpi-value{font-family:'Playfair Display',serif;font-size:1.75rem;color:var(--gold);font-weight:700;line-height:1}
.kpi.accent .kpi-value{color:var(--text);font-size:1.9rem}
.kpi-sub{font-size:.62rem;color:var(--muted);margin-top:.35rem}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--border);margin-bottom:2px}
.panel{background:var(--surface);padding:1.4rem 1.6rem}
.panel.yt{background:#0a0e14}
.panel.fb{background:#0d0d16}
.panel-title{font-size:.62rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:1rem}
.badge{font-size:.52rem;letter-spacing:.08em;padding:1px 6px;border:.5px solid;display:inline-block;margin-left:.4rem;vertical-align:middle}
.badge-yt{color:#7B9EB8;border-color:rgba(123,158,184,.4)}
.badge-fb{color:#8ca3c8;border-color:rgba(140,163,200,.4)}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.mk-label{font-size:.55rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:.3rem}
.mk-val{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--gold);font-weight:700}
.panel.yt .mk-val{color:#7B9EB8}
.panel.fb .mk-val{color:#8ca3c8}
.chart-full{background:var(--surface);padding:1.6rem;margin-bottom:2px}
.grid21{display:grid;grid-template-columns:2fr 1fr;gap:2px;background:var(--border);margin-bottom:2px}
.chart-box{background:var(--surface);padding:1.6rem}
.chart-title{font-size:.65rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:1rem}
.table-box{background:var(--surface);padding:1.6rem;margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:.5rem .7rem;border-bottom:.5px solid var(--border);text-align:right}
th:first-child{text-align:left}
td{padding:.75rem .7rem;border-bottom:.5px solid rgba(196,163,90,.07);text-align:right}
td:first-child{text-align:left;color:var(--muted);font-size:.73rem}
tr:last-child td{border-bottom:none}
.tdname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.cv-pill{display:inline-block;background:rgba(76,175,125,.14);color:#4CAF7D;font-size:.6rem;padding:2px 8px}
.view{display:none}.view.active{display:block}
#loading{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:999;transition:opacity .4s}
#loading .ld-logo{font-family:'Playfair Display',serif;font-size:1.8rem;letter-spacing:.2em;text-transform:uppercase}
#loading .ld-sub{font-size:.65rem;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;animation:pulse 1.5s infinite}
.error-box{background:rgba(224,92,92,.08);border:.5px solid rgba(224,92,92,.3);color:#E05C5C;padding:1.4rem;margin:1.5rem 0;font-size:.82rem;line-height:1.9}
footer{padding:1.4rem 0}
.ftr{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
footer p{font-size:.63rem;color:rgba(244,236,219,.2);letter-spacing:.04em}
@media(max-width:700px){.grid21,.two-col{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}.mini-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="loading"><div class="ld-logo">FrancDirect</div><div class="ld-sub">Loading&nbsp;&nbsp;Dashboard</div></div>
<div class="wrap">
<header>
  <div class="hdr">
    <div>
      <div class="brand-logo">FrancDirect</div>
      <div class="brand-sub">YouTube + Meta 広告ダッシュボード</div>
    </div>
    <div class="hdr-right">
      <span class="last-upd" id="updated-at">—</span>
      <button class="refresh-btn" onclick="loadData()">↻ 更新</button>
      <span class="live-dot"></span>
    </div>
  </div>
</header>
<hr class="rule">

<div class="period-bar" id="period-bar">
  <button class="period-btn active" data-view="today">今日</button>
  <button class="period-btn" data-view="yesterday">昨日</button>
  <button class="period-btn" data-view="last_week">先週</button>
  <button class="period-btn" data-view="this_month">今月</button>
</div>
<div id="error-area"></div>
